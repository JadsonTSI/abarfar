<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 650" width="100%" height="100%" style="background-color: #1e1e2e; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
  <!-- Estilos CSS -->
  <style>
    .title { font-size: 24px; font-weight: bold; fill: #cdd6f4; text-anchor: middle; }
    .subtitle { font-size: 14px; fill: #a6adc8; text-anchor: middle; }
    .board-title { font-size: 16px; font-weight: bold; fill: #f38ba8; }
    .board-rect { fill: #313244; stroke: #45475a; stroke-width: 2; rx: 8; }
    .pin-label { font-size: 10px; fill: #bac2de; font-family: monospace; }
    .pin-circle { fill: #11111b; stroke: #f9e2af; stroke-width: 1.5; }
    .wire { fill: none; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    .table-header { font-size: 12px; font-weight: bold; fill: #cdd6f4; }
    .table-cell { font-size: 11px; fill: #a6adc8; }
    .obs-title { font-size: 12px; font-weight: bold; fill: #f9e2af; }
    .obs-text { font-size: 11px; fill: #bac2de; }
  </style>

  <!-- Título Geral -->
  <text x="510" y="45" class="title">SGOEM - DIAGRAMA DE CONEXÕES IoT</text>
  <text x="510" y="68" class="subtitle">ESP32 Dev Module + Adafruit PN532 (I2C) + Buzzer Ativo 5V</text>

  <!-- ==================== PLACA ESP32 (Esquerda) ==================== -->
  <g transform="translate(80, 100)">
    <!-- Corpo da Placa (Largura aumentada de 220 para 280 para evitar overlaps) -->
    <rect x="0" y="0" width="280" height="420" class="board-rect" />
    
    <!-- Chip Central (Redimensionado e centralizado de forma limpa) -->
    <rect x="85" y="40" width="110" height="110" fill="#181825" stroke="#313244" stroke-width="2" rx="4" />
    <text x="140" y="95" fill="#a6adc8" font-size="14" font-weight="bold" text-anchor="middle">ESP32</text>
    <text x="140" y="115" fill="#585b70" font-size="8" font-weight="bold" text-anchor="middle">WROOM-32</text>
    
    <rect x="105" y="380" width="70" height="40" fill="#45475a" rx="2" />
    <text x="140" y="405" fill="#11111b" font-size="10" font-weight="bold" text-anchor="middle">USB</text>

    <!-- Pinos Lado Esquerdo (x=0, texto alinhado à esquerda) -->
    <g transform="translate(0, 20)">
      <circle cx="0" cy="30" r="5" class="pin-circle" />
      <text x="12" y="33" class="pin-label">3V3</text>
      
      <circle cx="0" cy="60" r="5" class="pin-circle" />
      <text x="12" y="63" class="pin-label">EN</text>
      
      <circle cx="0" cy="90" r="5" class="pin-circle" />
      <text x="12" y="93" class="pin-label">VP</text>
      
      <circle cx="0" cy="120" r="5" class="pin-circle" />
      <text x="12" y="123" class="pin-label">VN</text>
      
      <circle cx="0" cy="150" r="5" class="pin-circle" />
      <text x="12" y="153" class="pin-label">D34</text>
      
      <circle cx="0" cy="180" r="5" class="pin-circle" />
      <text x="12" y="183" class="pin-label">D35</text>
      
      <circle cx="0" cy="210" r="5" class="pin-circle" />
      <text x="12" y="213" class="pin-label">D32</text>
      
      <circle cx="0" cy="240" r="5" class="pin-circle" />
      <text x="12" y="243" class="pin-label">D33</text>
      
      <circle cx="0" cy="270" r="5" class="pin-circle" />
      <text x="12" y="273" class="pin-label">D25</text>
      
      <circle cx="0" cy="300" r="5" class="pin-circle" />
      <text x="12" y="303" class="pin-label">D26</text>
      
      <circle cx="0" cy="330" r="5" class="pin-circle" />
      <text x="12" y="333" class="pin-label">D27</text>
      
      <circle cx="0" cy="360" r="5" class="pin-circle" />
      <text x="12" y="363" class="pin-label" fill="#f5c2e7" font-weight="bold">D13 (Buzzer)</text>
      
      <circle cx="0" cy="390" r="5" class="pin-circle" />
      <text x="12" y="393" class="pin-label" fill="#a6e3a1">GND</text>
    </g>

    <!-- Pinos Lado Direito (x=280, texto alinhado à direita/fim com 'text-anchor: end') -->
    <g transform="translate(280, 20)">
      <circle cx="0" cy="30" r="5" class="pin-circle" />
      <text x="-12" y="33" class="pin-label" text-anchor="end" fill="#a6e3a1">GND</text>
      
      <circle cx="0" cy="60" r="5" class="pin-circle" />
      <text x="-12" y="63" class="pin-label" text-anchor="end">D23</text>
      
      <circle cx="0" cy="90" r="5" class="pin-circle" />
      <text x="-12" y="93" class="pin-label" text-anchor="end" fill="#f9e2af" font-weight="bold">D22 (SCL)</text>
      
      <circle cx="0" cy="120" r="5" class="pin-circle" />
      <text x="-12" y="123" class="pin-label" text-anchor="end" fill="#89b4fa" font-weight="bold">D21 (SDA)</text>
      
      <circle cx="0" cy="150" r="5" class="pin-circle" />
      <text x="-12" y="153" class="pin-label" text-anchor="end">D19</text>
      
      <circle cx="0" cy="180" r="5" class="pin-circle" />
      <text x="-12" y="183" class="pin-label" text-anchor="end">D18</text>
      
      <circle cx="0" cy="210" r="5" class="pin-circle" />
      <text x="-12" y="213" class="pin-label" text-anchor="end">D5</text>
      
      <circle cx="0" cy="240" r="5" class="pin-circle" />
      <text x="-12" y="243" class="pin-label" text-anchor="end">D17</text>
      
      <circle cx="0" cy="270" r="5" class="pin-circle" />
      <text x="-12" y="273" class="pin-label" text-anchor="end">D16</text>
      
      <circle cx="0" cy="300" r="5" class="pin-circle" />
      <text x="-12" y="303" class="pin-label" text-anchor="end" fill="#fab387" font-weight="bold">D4 (RST)</text>
      
      <circle cx="0" cy="330" r="5" class="pin-circle" />
      <text x="-12" y="333" class="pin-label" text-anchor="end" fill="#a6e3a1" font-weight="bold">D2 (IRQ)</text>
      
      <circle cx="0" cy="360" r="5" class="pin-circle" />
      <text x="-12" y="363" class="pin-label" text-anchor="end">D15</text>
      
      <circle cx="0" cy="390" r="5" class="pin-circle" />
      <text x="-12" y="393" class="pin-label" text-anchor="end" fill="#f38ba8" font-weight="bold">5V (VIN)</text>
    </g>
  </g>

  <!-- ==================== LEITOR PN532 (Direita) ==================== -->
  <g transform="translate(680, 150)">
    <!-- Corpo do Leitor -->
    <rect x="0" y="0" width="240" height="280" fill="#901a1e" stroke="#f38ba8" stroke-width="4" rx="12" />
    <rect x="20" y="20" width="200" height="240" fill="none" stroke="#f38ba8" stroke-width="1.5" stroke-dasharray="8,6" rx="8" />
    <text x="120" y="110" fill="#f9e2af" font-size="18" font-weight="bold" text-anchor="middle">PN532 NFC</text>
    <text x="120" y="135" fill="#eba0ac" font-size="11" font-weight="bold" text-anchor="middle">RFID Reader Module</text>

    <!-- DIP Switches do Protocolo -->
    <g transform="translate(140, 30)">
      <rect x="0" y="0" width="50" height="30" fill="#313244" stroke="#585b70" stroke-width="1" />
      <!-- Chave 1 (SEL0) - OFF (baixo) -->
      <rect x="8" y="15" width="12" height="10" fill="#f38ba8" />
      <text x="14" y="10" fill="#bac2de" font-size="8" text-anchor="middle">0</text>
      <!-- Chave 2 (SEL1) - ON (alto) -->
      <rect x="30" y="5" width="12" height="10" fill="#a6e3a1" />
      <text x="36" y="25" fill="#bac2de" font-size="8" text-anchor="middle">1</text>
      <text x="-50" y="20" fill="#bac2de" font-size="9">I2C Mode:</text>
    </g>

    <!-- Pinos de Conexão - Lado Esquerdo do Leitor (I2C) -->
    <g transform="translate(0, 80)">
      <circle cx="0" cy="20" r="5" class="pin-circle" />
      <text x="12" y="23" class="pin-label" fill="#f38ba8">VCC</text>
      
      <circle cx="0" cy="50" r="5" class="pin-circle" />
      <text x="12" y="53" class="pin-label" fill="#a6e3a1">GND</text>
      
      <circle cx="0" cy="80" r="5" class="pin-circle" />
      <text x="12" y="83" class="pin-label" fill="#89b4fa">SDA</text>
      
      <circle cx="0" cy="110" r="5" class="pin-circle" />
      <text x="12" y="113" class="pin-label" fill="#f9e2af">SCL</text>
    </g>

    <!-- Pinos de Controle - Parte Inferior do Leitor -->
    <g transform="translate(30, 280)">
      <circle cx="30" cy="0" r="5" class="pin-circle" />
      <text x="30" y="-12" class="pin-label" text-anchor="middle" fill="#fab387">RSTN</text>
      
      <circle cx="80" cy="0" r="5" class="pin-circle" />
      <text x="80" y="-12" class="pin-label" text-anchor="middle" fill="#a6e3a1">IRQ</text>
    </g>
  </g>

  <!-- ==================== BUZZER ATIVO 5V (Centro-Baixo) ==================== -->
  <g transform="translate(420, 430)">
    <circle cx="50" cy="50" r="40" fill="#11111b" stroke="#313244" stroke-width="3" />
    <circle cx="50" cy="50" r="8" fill="#313244" />
    <text x="50" y="32" fill="#cdd6f4" font-size="10" font-weight="bold" text-anchor="middle">BUZZER</text>
    
    <circle cx="30" cy="80" r="4" class="pin-circle" />
    <text x="30" y="70" fill="#f5c2e7" font-size="12" font-weight="bold" text-anchor="middle">+</text>
    
    <circle cx="70" cy="80" r="4" class="pin-circle" />
    <text x="70" y="70" fill="#a6e3a1" font-size="12" font-weight="bold" text-anchor="middle">-</text>
  </g>

  <!-- ==================== CABOS / FIOS (WIRES) ==================== -->
  <!-- 1. VCC (Fio Vermelho): PN532 VCC (680, 250) -> ESP32 5V (360, 510) -->
  <path d="M 680 250 L 640 250 L 640 510 L 360 510" class="wire" stroke="#f38ba8" />

  <!-- 2. GND (Fio Preto): PN532 GND (680, 280) -> ESP32 GND (360, 150) -->
  <path d="M 680 280 L 620 280 L 620 150 L 360 150" class="wire" stroke="#11111b" />

  <!-- 3. SDA (Fio Azul): PN532 SDA (680, 310) -> ESP32 D21 (360, 240) -->
  <path d="M 680 310 L 600 310 L 600 240 L 360 240" class="wire" stroke="#89b4fa" />

  <!-- 4. SCL (Fio Amarelo): PN532 SCL (680, 340) -> ESP32 D22 (360, 210) -->
  <path d="M 680 340 L 580 340 L 580 210 L 360 210" class="wire" stroke="#f9e2af" />

  <!-- 5. RSTN (Fio Laranja): PN532 RSTN (740, 430) -> ESP32 D4 (360, 420) -->
  <path d="M 740 430 L 740 470 L 550 470 L 550 420 L 360 420" class="wire" stroke="#fab387" />

  <!-- 6. IRQ (Fio Verde): PN532 IRQ (790, 430) -> ESP32 D2 (360, 450) -->
  <path d="M 790 430 L 790 490 L 530 490 L 530 450 L 360 450" class="wire" stroke="#a6e3a1" />

  <!-- 7. Buzzer Positivo (Fio Roxo): Buzzer + (450, 510) -> ESP32 D13 (80, 480) -->
  <path d="M 450 510 L 450 540 L 50 540 L 50 480 L 80 480" class="wire" stroke="#c29ef5" />

  <!-- 8. Buzzer Negativo (Fio Cinza): Buzzer - (490, 510) -> ESP32 GND Esquerdo (80, 510) -->
  <path d="M 490 510 L 490 560 L 30 560 L 30 510 L 80 510" class="wire" stroke="#949cbb" />

  <!-- ==================== LEGENDA E TABELA DE CONEXÕES ==================== -->
  <!-- Moldura de Legendas -->
  <rect x="80" y="540" width="860" height="90" fill="#181825" stroke="#313244" stroke-width="1.5" rx="6" />

  <!-- Legenda de Cores -->
  <g transform="translate(100, 555)">
    <text x="0" y="10" class="obs-title">LEGENDA DE CORES</text>
    
    <rect x="0" y="25" width="12" height="6" fill="#f38ba8" />
    <text x="20" y="31" class="obs-text">VCC (5V)</text>
    
    <rect x="0" y="45" width="12" height="6" fill="#11111b" stroke="#585b70" />
    <text x="20" y="51" class="obs-text">GND</text>
    
    <rect x="100" y="25" width="12" height="6" fill="#89b4fa" />
    <text x="120" y="31" class="obs-text">SDA (I2C)</text>
    
    <rect x="100" y="45" width="12" height="6" fill="#f9e2af" />
    <text x="120" y="51" class="obs-text">SCL (I2C)</text>
    
    <rect x="200" y="25" width="12" height="6" fill="#a6e3a1" />
    <text x="220" y="31" class="obs-text">IRQ / Buzzer -</text>
    
    <rect x="200" y="45" width="12" height="6" fill="#fab387" />
    <text x="220" y="51" class="obs-text">RST (Reset)</text>
  </g>

  <!-- Notas de Observações -->
  <g transform="translate(500, 555)">
    <text x="0" y="10" class="obs-title">OBSERVAÇÕES TÉCNICAS DO PROJETO</text>
    <text x="0" y="28" class="obs-text">• O PN532 está alimentado em 5V (VCC) para máximo alcance da antena RF.</text>
    <text x="0" y="45" class="obs-text">• Os DIP switches 1 e 2 no PN532 devem estar configurados em [OFF, ON] para Modo I2C.</text>
    <text x="0" y="62" class="obs-text">• O Buzzer ativo de 5V apita ao receber sinal HIGH na porta GPIO 13 (D13).</text>
  </g>
</svg>
