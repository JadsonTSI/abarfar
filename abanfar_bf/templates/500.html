<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Erro temporário — ABANFAR BF</title>
    <style>
        /* Página independente: num erro 500 o resto do site pode não estar disponível */
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               background: #1A1612; color: #F5E9C8; font-family: Georgia, 'Times New Roman', serif; text-align: center; padding: 1.5rem; }
        .codigo { font-size: clamp(4rem, 15vw, 7rem); font-weight: 900; color: #C9A84C; line-height: 1; }
        h1 { font-size: clamp(1.5rem, 4vw, 2rem); margin: 1rem 0 .6rem; color: #FFFFFF; }
        p { font-size: 1.15rem; color: #C8BFB4; max-width: 480px; margin: 0 auto 2rem; line-height: 1.6; }
        a { display: inline-block; background: #C9A84C; color: #1A1612; text-decoration: none; font-weight: 700;
            letter-spacing: .08em; text-transform: uppercase; font-size: .8rem; padding: .8rem 1.6rem; border-radius: .6rem; }
    </style>
</head>
<body>
    <main>
        <div class="codigo" aria-hidden="true">♪</div>
        <h1>Tivemos um problema por aqui</h1>
        <p>Algo deu errado do nosso lado. Tente novamente em alguns instantes.</p>
        <a href="/">Voltar ao início</a>
    </main>
</body>
</html>
